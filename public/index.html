<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineMais — Catálogo de Filmes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
 
  <header>
    <div class="header-inner">
      <div class="logo-block">
        <div class="logo">Cine<span class="logo-plus">Mais</span></div>
        <div class="logo-badge">TMDB</div>
      </div>
      <p class="tagline">Descubra filmes que vão marcar você</p>
 
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input id="search" type="text" placeholder="Buscar por título..." autocomplete="off" />
        <button id="btnSearch">Buscar</button>
      </div>
    </div>
  </header>
 
  <nav class="filter-bar">
    <div class="filter-inner">
      <button class="filter-btn active" data-endpoint="popular">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
        Populares
      </button>
      <button class="filter-btn" data-endpoint="top_rated">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        Mais Avaliados
      </button>
      <button class="filter-btn" data-endpoint="now_playing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
        Em Cartaz
      </button>
      <button class="filter-btn" data-endpoint="upcoming">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Em Breve
      </button>
    </div>
  </nav>
 
  <main>
    <p id="message"></p>
    <div id="movie-list"></div>
  </main>
 
  <footer>
    <div class="footer-logo">Cine<span>Mais</span></div>
    <p>Dados fornecidos por <a href="https://www.themoviedb.org" target="_blank">The Movie Database (TMDB)</a></p>
  </footer>
 
  <script src="script.js"></script>
</body>
</html>
